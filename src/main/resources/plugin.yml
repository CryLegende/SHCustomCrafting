name: SHCustomCrafting
version: '${project.version}'
main: org.Cry_Legende.sHCustomCrafting.SHCustomCrafting
api-version: '1.21'
author: Cry_Legende
description: Recettes SkyHand et crafts vanilla désactivés (remplace CustomCrafting).

commands:
  shcustomcrafting:
    description: Recharge ou liste les recettes.
    usage: /<command> <reload|list>
    aliases: [shcc]

permissions:
  shcustomcrafting.admin:
    description: Toute l'administration de SHCustomCrafting
    default: op
    children:
      shcustomcrafting.admin.reload: true
      shcustomcrafting.admin.list: true
  shcustomcrafting.admin.reload:
    description: Recharger les recettes
    default: op
  shcustomcrafting.admin.list:
    description: Lister les recettes
    default: op
