# ======================================================================== #
# SHCustomCrafting
#
# Plugin : retire des recettes vanilla, bloque certains crafts (le résultat affiche un objet explicatif) et ajoute des
# recettes SkyHand, avec un livre de recettes pour les joueurs.
#
# Commande (alias : /shcc) :
#   /shcustomcrafting reload   Relit config.yml et messages.yml puis réapplique les recettes : les recettes vanilla
#                              sorties de la liste sont rétablies, celles qui y entrent sont retirées. Un fichier
#                              illisible ne change rien.
#   /shcustomcrafting list     Liste les recettes personnalisées, les crafts bloqués et le nombre de recettes vanilla
#                              retirées, avec les entrées de recettes-desactivees introuvables.
#
# Permissions (par défaut : op) :
#   shcustomcrafting.admin          Toutes les sous-commandes.
#   shcustomcrafting.admin.reload   /shcustomcrafting reload
#   shcustomcrafting.admin.list     /shcustomcrafting list
#
# Les textes (craft bloqué, rechargement...) sont dans messages.yml.
#
# Sections :
#   recettes-desactivees   Identifiants des recettes vanilla à retirer (minecraft:hopper...).
#   crafts-bloques         forme et ingredients du craft à bloquer, affichage (materiau, nom, lore) de l'objet résultat.
#   recettes               type (shaped avec forme + ingredients, ou shapeless avec une liste d'ingredients), resultat,
#                          quantite, livre (true : visible dans le livre de recettes), nom-contient (n'accepte
#                          l'ingrédient que si son nom contient ce texte).
# ======================================================================== #

# Recettes vanilla supprimées au démarrage.
# Les "armor_trim_smithing_template" sont les recettes de duplication des modèles de garniture.
recettes-desactivees:
  # 1.21.2 : bundle, dont les 16 couleurs (ici deux exemples)
  - minecraft:bundle
  - minecraft:white_bundle
  # 1.21 : le crafter automatise la compression (lingots -> blocs)
  - minecraft:crafter
  # Duplication d'un modèle de garniture
  - minecraft:coast_armor_trim_smithing_template

# Crafts bloqués : le résultat affiche un objet explicatif et le craft est refusé.
crafts-bloques:
  crafter:
    forme: ['FFF', 'FTF', 'RDR']
    ingredients:
      F: IRON_INGOT
      T: CRAFTING_TABLE
      R: REDSTONE
      D: DROPPER
    affichage:
      materiau: BARRIER
      nom: '&cCraft désactivé'
      lore:
        - '&7Le crafter est désactivé'
        - '&7sur ce serveur.'

# type: shaped (forme + ingredients) ou shapeless (liste d'ingredients)
# livre: true pour afficher la recette dans le livre de recettes des joueurs
# nom-contient: n'accepte l'ingrédient que si son nom contient ce texte
recettes:
  neige_poudreuse:
    type: shaped
    forme: ['SSS', 'SBS', 'SSS']
    ingredients:
      S: SNOWBALL
      B: BUCKET
    resultat: POWDER_SNOW_BUCKET
    livre: true
  poisson_morue:
    type: shapeless
    ingredients: [COD, WATER_BUCKET]
    resultat: COD_BUCKET
    livre: true
  # Un entonnoir renommé « Entonnoir spécial » redevient un entonnoir classique
  entonnoir_special:
    type: shapeless
    ingredients: [HOPPER]
    nom-contient: 'Entonnoir spécial'
    resultat: HOPPER
    livre: false
